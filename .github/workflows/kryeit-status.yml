name: Update Kryeit Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Get Kryeit status
        run: |
          curl -fL "https://kryeit.com/api/server/status" -o status.json
          cat status.json

      - name: Put status in Issue #1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit 1 \
            --repo "${{ github.repository }}" \
            --body "$(cat status.json)"
