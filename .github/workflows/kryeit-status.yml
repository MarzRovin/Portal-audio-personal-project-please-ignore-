name: Update Kryeit Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Get Kryeit status
        run: |
          curl -fL "https://kryeit.com/api/server/status" -o status.json
          cat status.json

      - name: Update status.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cp status.json repo/status.json

          cd repo
          git add status.json
          git diff --cached --quiet || git commit -m "Update Kryeit status"
          git push
